# Runner и Docker сборки находятся на CI-сервере. На production Runner не нужен.
stages: [build, deploy]
default:
  tags: [docker-ci]
variables:
  DOCKER_HOST: unix:///var/run/docker.sock

build-images:
  stage: build
  image: docker:27
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apk add --no-cache bash
  script:
    - bash deploy/build.sh

deploy-production:
  stage: deploy
  image: alpine:3.20
  variables:
    GIT_STRATEGY: none
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p "${DEPLOY_PORT}" -t ed25519 "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh -p "${DEPLOY_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes "deploy@$DEPLOY_HOST" "sudo /opt/otus-delivery/bin/deploy.sh $CI_COMMIT_SHA"
