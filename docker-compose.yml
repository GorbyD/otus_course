services:

  # Балансировщик
  nginx-lb:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx-lb/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - nginx-back1
      - nginx-back2

  # Back1
  nginx-back1:
    image: nginx:1.27-alpine
    volumes:
      - ./www:/var/www/html:ro
      - ./docker/nginx-backend/templates:/etc/nginx/templates:ro
    environment:
      PHP_FPM_HOST: php-fpm1
    depends_on:
      - php-fpm1

  php-fpm1:
    build:
      context: ./docker/php
    volumes:
      - ./www:/var/www/html:ro
      - ./db:/db:ro
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      PG_HOST: postgres
      PG_DB: ${POSTGRES_DB}
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
      ES_HOST: ${ES_HOST}
      ES_PORT: ${ES_PORT}
      ES_INDEX: ${ES_INDEX}
    depends_on:
      - postgres
      - redis
      - elasticsearch

  # Back2
  nginx-back2:
    image: nginx:1.27-alpine
    volumes:
      - ./www:/var/www/html:ro
      - ./docker/nginx-backend/templates:/etc/nginx/templates:ro
    environment:
      PHP_FPM_HOST: php-fpm2
    depends_on:
      - php-fpm2

  php-fpm2:
    build:
      context: ./docker/php
    volumes:
      - ./www:/var/www/html:ro
      - ./db:/db:ro
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      PG_HOST: postgres
      PG_DB: ${POSTGRES_DB}
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
      ES_HOST: ${ES_HOST}
      ES_PORT: ${ES_PORT}
      ES_INDEX: ${ES_INDEX}
    depends_on:
      - postgres
      - redis
      - elasticsearch

  # Redis
  redis:
    image: redis:7.4-alpine
    command: redis-server --save 60 1 --dir /data # сохранять снапшот если за 60 с изменился хотя бы 1 ключ
    volumes:
      - redis-data:/data

  # БД
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./storage/postgres:/var/lib/postgresql/data



  memcached:
    image: memcached:1.6-alpine

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data

volumes:
  redis-data:
  es-data:
